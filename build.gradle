plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
}

group = 'nl.uncinc.androidci'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    google()
}

gradlePlugin {
    plugins {
        UncIncAndroidCI {
            id = 'nl.uncinc.androidci'
            implementationClass = 'nl.uncinc.androidci.UncIncAndroidCIPlugin'
        }
    }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.android.tools.build:gradle:8.7.3'
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    repositories {
        maven {
            name = 'uncinc'
            url = uri('https://releases.uncinc.nl/maven')
            // Credentials configured via gradle.properties or environment variables:
            //   ORG_GRADLE_PROJECT_uncincMavenUser
            //   ORG_GRADLE_PROJECT_uncincMavenPassword
            credentials {
                username = findProperty('uncincMavenUser') ?: ''
                password = findProperty('uncincMavenPassword') ?: ''
            }
        }
    }
}
